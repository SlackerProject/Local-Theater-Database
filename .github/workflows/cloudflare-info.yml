# Run by hand: shows which Cloudflare domains (zones) and workers.dev
# address the deploy key can see. Prints names only, never the key.
name: Cloudflare info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: List domains and the workers.dev address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "Token check:"; curl -s -H "$auth" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status}'
          echo "Domains:"; curl -s -H "$auth" "https://api.cloudflare.com/client/v4/zones?per_page=50" | jq -r 'if .success then (.result[] | "\(.name) (\(.status), plan: \(.plan.name))") else (.errors | tostring) end'
          echo "workers.dev:"; curl -s -H "$auth" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -c '{success, subdomain: .result.subdomain, errors}'
