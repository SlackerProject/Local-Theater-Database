# Builds the site for Cloudflare Workers on Linux (OpenNext doesn't build
# reliably on Windows), checks the main pages load, and deploys from main.
#
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#              NEXT_PUBLIC_SITE_URL (public values; they ship to every browser)
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (deploying only)
name: Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build for Cloudflare
        run: |
          node scripts/patch-opennext.mjs
          npx opennextjs-cloudflare build

      - name: Check the main pages load in Cloudflare's runtime
        run: |
          npx opennextjs-cloudflare preview --port 8787 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8787/ && break; sleep 2; done
          failed=0
          for path in / /shows /people /companies /auditions /hotlist /signin /updates; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8787$path")
            echo "$code $path"
            [ "$code" = "200" ] || failed=1
          done
          if [ "$failed" = "1" ]; then echo "--- preview log ---"; tail -60 preview.log; exit 1; fi

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
